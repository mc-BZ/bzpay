[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bzpay"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "zaf-x", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "requests"
]

[project.urls]
Documentation = "https://github.com/zaf-x/bzpay#readme"
Issues = "https://github.com/zaf-x/bzpay/issues"
Source = "https://github.com/zaf-x/bzpay"

[tool.hatch.version]
path = "src/bzpay/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/bzpay tests}"

[tool.coverage.run]
source_pkgs = ["bzpay", "tests"]
branch = true
parallel = true
omit = [
  "src/bzpay/__about__.py",
]

[tool.coverage.paths]
bzpay = ["src/bzpay", "*/bzpay/src/bzpay"]
tests = ["tests", "*/bzpay/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
